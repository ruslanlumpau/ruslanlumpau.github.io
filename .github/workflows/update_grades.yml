name: Update Timur Grades

on:
  schedule:
    # Запуск каждый день в 18:00 по минскому времени (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Получение оценок с e-schools.by
        env:
          ESCHOOLS_LOGIN: ${{ secrets.ESCHOOLS_LOGIN }}
          ESCHOOLS_PASSWORD: ${{ secrets.ESCHOOLS_PASSWORD }}
        run: |
          python fetch_grades.py

      - name: Сохранение обновлённого data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Автообновление оценок"
          git push
